spring:
  application:
    name: santo-brigadeiro-backend

  datasource:
    # Os valores após ":" são defaults usados SE a variável de ambiente
    # não existir — assim o projeto roda "out of the box" em dev local,
    # mas em produção você sobrescreve via variáveis de ambiente reais,
    # sem nunca commitar credenciais de verdade no repositório.
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:santo_brigadeiro}
    username: ${POSTGRES_USER:santo_brigadeiro_user}
    password: ${POSTGRES_PASSWORD:changeme_local_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # "validate" (não "update" nem "create"): o Hibernate confere se as
      # Entities batem com o schema, mas quem CRIA/ALTERA tabelas é
      # exclusivamente o Flyway. Isso evita duas ferramentas competindo
      # pelo controle do schema — uma fonte única de verdade estrutural.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # Local padrão do Flyway: dentro do próprio classpath da aplicação.
    locations: classpath:db/migration

server:
  port: 8080
