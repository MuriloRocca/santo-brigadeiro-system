version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: santo-brigadeiro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-santo_brigadeiro}
      POSTGRES_USER: ${POSTGRES_USER:-santo_brigadeiro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev}
    ports:
      - "5432:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a "docker compose down" e a
      # reinicializações do container. Só somem se você rodar
      # "docker compose down -v" explicitamente.
      - santo_brigadeiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-santo_brigadeiro_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Alternativa leve ao pgAdmin: interface web para inspecionar o banco,
  # sem instalar nada na sua máquina. Acesse http://localhost:8081
  # depois de subir o docker compose (servidor: postgres / porta: 5432).
  adminer:
    image: adminer:latest
    container_name: santo-brigadeiro-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  santo_brigadeiro_pgdata:
